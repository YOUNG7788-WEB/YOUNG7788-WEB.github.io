name: Website security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository without retaining Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate script hashes, publication boundary and secret signatures
        run: python3 scripts/check_site_security.py .

      - name: Check security headers and public-resource routing
        run: node scripts/test_secure_runtime.mjs
